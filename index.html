    <style>
/* ===== JAM DIGITAL ===== */
#clock-container {
    background: #f7fafc;
    border-radius: 10px;
    padding: 15px;
    margin: 20px 0;
    transition: background 0.5s ease;
}
body.dark-mode #clock-container {
    background: #2d3748;
}
#clock {
    font-size: 28px;
    font-weight: bold;
    color: #2d3748;
    font-family: 'Courier New', monospace;
    transition: color 0.5s ease;
}
body.dark-mode #clock {
    color: #e2e8f0;
}
	/* ===== DARK MODE ===== */
body.dark-mode {
    background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
}

body.dark-mode .card {
    background-color: rgba(26, 32, 44, 0.95);
}

body.dark-mode h1 {
    color: #e2e8f0;
}

body.dark-mode p {
    color: #a0aec0;
}

body.dark-mode .badge {
    background: #2d3748;
    color: #e2e8f0;
}

body.dark-mode .stats .number {
    color: #e2e8f0;
}

body.dark-mode .btn-outline {
    color: #e2e8f0;
    border-color: #e2e8f0;
}

body.dark-mode .btn-outline:hover {
    background: #e2e8f0;
    color: #2d3748;
}

body.dark-mode .footer {
    color: #718096;
}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }
        h1 { color: #2d3748; }
        .badge {
            display: inline-block;
            background: #edf2f7;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            margin: 10px 5px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        hr { margin: 30px 0; }
        .stats { display: flex; justify-content: space-around; }
        .stats .number { font-size: 24px; font-weight: bold; color: 
#2d3748; }
        .stats .label { font-size: 14px; color: #a0aec0; }
        .footer { font-size: 14px; color: #a0aec0; margin-top: 20px; }
        
        /* Responsif HP */
        @media (max-width: 768px) {
            .card { padding: 20px; }
            .profile-img { width: 80px; height: 80px; }
            h1 { font-size: 22px; }
            .badge { font-size: 12px; padding: 4px 10px; }
            .btn { padding: 8px 15px; font-size: 14px; }
        }
        @media (max-width: 480px) {
            .card { padding: 15px; }
            .profile-img { width: 60px; height: 60px; }
            h1 { font-size: 18px; }
            .stats .number { font-size: 18px; }
        }
#darkModeBtn {
    background: #667eea;
    color: white;
    border: 2px solid #667eea;
    transition: background 0.3s ease;
}

#darkModeBtn:hover {
    background: #5a67d8;
    color: white;
}
// ===== JAM DIGITAL =====
function updateClock() {
    const now = new Date();
    const jam = String(now.getHours()).padStart(2, '0');
    const menit = String(now.getMinutes()).padStart(2, '0');
    const detik = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = 
`${jam}:${menit}:${detik}`;
}
setInterval(updateClock, 1000);
updateClock();
</style>

<script>
    // ===== DARK MODE =====
    function toggleDarkMode() {
        const body = document.body;
        body.classList.toggle('dark-mode');
        
        const btn = document.getElementById('darkModeBtn');
        if (body.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Mode Terang';
        } else {
            btn.textContent = '🌙 Mode Gelap';
        }
    }
</script>
