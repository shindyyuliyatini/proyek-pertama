<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Shindy Yuliyatini</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #2d3748; text-align: center; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #5a67d8; }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline:hover { background: #667eea; color: white; }
        label { display: block; margin-bottom: 5px; color: #4a5568; }
        input, textarea {
            width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;
            box-sizing: border-box; margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }
        input:focus, textarea:focus { border-color: #667eea; outline: none; }
        .error { border-color: #e53e3e !important; }
        .success { border-color: #38a169 !important; }
        .error-message { color: #e53e3e; font-size: 12px; display: none; }
        .success-message { display: none; background: #c6f6d5; color: #22543d; padding: 15px; border-radius: 10px; margin-top: 15px; }
        .tombol-kembali { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📩 Hubungi Saya</h1>
        
        <form id="contact-form">
            <div>
                <label>Nama</label>
                <input type="text" id="contact-name" placeholder="Masukkan nama...">
                <small id="name-error" class="error-message">Nama harus diisi!</small>
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="contact-email" placeholder="Masukkan email...">
                <small id="email-error" class="error-message">Email tidak valid!</small>
            </div>
            <div>
                <label>Pesan</label>
                <textarea id="contact-message" rows="4" placeholder="Tulis pesan..."></textarea>
                <small id="message-error" class="error-message">Pesan harus diisi!</small>
            </div>
            <button type="submit" class="btn" style="width: 100%;">📤 Kirim Pesan</button>
        </form>

        <div id="form-success" class="success-message">✅ Pesan berhasil dikirim! Terima kasih.</div>

        <div class="tombol-kembali">
            <a href="https://shindyyuliyatin.github.io/proyek-pertama/" class="btn btn-outline">🏠 Kembali ke Portofolio</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contact-form');
            const nameInput = document.getElementById('contact-name');
            const emailInput = document.getElementById('contact-email');
            const messageInput = document.getElementById('contact-message');
            const nameError = document.getElementById('name-error');
            const emailError = document.getElementById('email-error');
            const messageError = document.getElementById('message-error');
            const successMessage = document.getElementById('form-success');

            function validateName() {
                if (nameInput.value.trim() === '') {
                    nameError.style.display = 'block';
                    nameInput.classList.add('error');
                    return false;
                } else {
                    nameError.style.display = 'none';
                    nameInput.classList.remove('error');
                    nameInput.classList.add('success');
                    return true;
                }
            }
            function validateEmail() {
                const email = emailInput.value.trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (email === '' || !emailPattern.test(email)) {
                    emailError.style.display = 'block';
                    emailInput.classList.add('error');
                    return false;
                } else {
                    emailError.style.display = 'none';
                    emailInput.classList.remove('error');
                    emailInput.classList.add('success');
                    return true;
                }
            }
            function validateMessage() {
                if (messageInput.value.trim() === '') {
                    messageError.style.display = 'block';
                    messageInput.classList.add('error');
                    return false;
                } else {
                    messageError.style.display = 'none';
                    messageInput.classList.remove('error');
                    messageInput.classList.add('success');
                    return true;
                }
            }

            nameInput.addEventListener('input', validateName);
            emailInput.addEventListener('input', validateEmail);
            messageInput.addEventListener('input', validateMessage);

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const isNameValid = validateName();
                const isEmailValid = validateEmail();
                const isMessageValid = validateMessage();
                if (isNameValid && isEmailValid && isMessageValid) {
                    successMessage.style.display = 'block';
                    form.reset();
                    document.querySelectorAll('input, textarea').forEach(function(el) {
                        el.classList.remove('success', 'error');
                    });
                    setTimeout(function() {
                        successMessage.style.display = 'none';
                    }, 5000);
                } else {
                    alert('❌ Mohon lengkapi semua field dengan benar!');
                }
            });
        });
    </script>
</body>
</html>
